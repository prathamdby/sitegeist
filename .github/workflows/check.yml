name: Check Extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install pinned legacy UI
        run: bash scripts/install-legacy-ui.sh
      - name: Install extension
        run: npm ci
      - name: Check extension and migration contracts
        run: ./check.sh && npm test && npm run check:bundle && git diff --exit-code
