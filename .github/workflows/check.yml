name: Check Extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install extension
        run: npm ci
      - name: Check extension
        timeout-minutes: 2
        run: ./check.sh
      - name: Critical migration contracts
        timeout-minutes: 2
        run: npm run test:ci
      - name: Verify browser bundle and clean tree
        timeout-minutes: 2
        run: npm run check:bundle && git diff --exit-code
      - name: Final runner resource diagnostics
        if: always()
        timeout-minutes: 1
        run: node scripts/ci-test-runner.mjs --diagnostics-only
